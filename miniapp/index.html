<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10131a" />
    <title>Проверка заявки</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell" aria-labelledby="page-title">
      <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
      <section class="panel">
        <header class="topbar"><div class="brand-mark">S</div><div><p class="eyebrow">SVOIZIZOV</p><h1 id="page-title">Подтвердите заявку</h1></div><div class="live-dot" aria-label="Бот онлайн"></div></header>
        <div class="event-card"><div><span class="event-label">Смена</span><strong>27.09 · воскресенье</strong></div><span class="event-status">Регистрация открыта</span></div>
        <div class="divider"></div>
        <section class="challenge" aria-live="polite">
          <p class="step">ШАГ 1 ИЗ 1</p><h2>Докажите, что вы человек</h2><p class="hint">Введите символы с картинки. Ответ не появится в группе.</p>
          <div class="recaptcha-wrap"><div class="g-recaptcha" data-sitekey="6LdF3dQtAAAAADx2g23742_MxcUZHKTMFuIPoIvv"></div></div>
          <form id="captcha-form" novalidate><label for="captcha-input">Код с изображения</label><div class="input-wrap"><input id="captcha-input" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" placeholder="Например, CGX849" /><span id="input-state" class="input-state"></span></div><p id="error" class="error" role="alert"></p><button id="submit" class="primary" type="submit">Подтвердить заявку <span>→</span></button></form>
          <div id="success" class="success" hidden><div class="success-icon">✓</div><div><strong>Заявка принята</strong><p>Можно закрыть это окно. Вы в очереди.</p></div></div>
        </section>
        <footer><span class="lock">⌁</span> Проверка действует 30 секунд</footer>
      </section>
    </main>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <script src="./app.js"></script>
  </body>
</html>
